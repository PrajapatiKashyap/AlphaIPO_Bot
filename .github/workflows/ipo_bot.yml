name: AlphaIPO Bot

on:
  schedule:
    # Run every day at 07:00 AM IST, 10:00 AM IST, and 02:00 PM IST (01:30, 04:30, 08:30 UTC)
    - cron: '30 1,4,8 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run IPO Monitor Bot
        run: python main.py

      - name: Commit and Push State File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent_ipos.json
          git diff-index --quiet HEAD || git commit -m "chore: update sent_ipos.json [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
